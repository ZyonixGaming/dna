<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <link rel="icon" type="image/x-icon" href="dna.ico">
    <title>SIMPR Horsey Genome Editor</title>
    <!-- crispr.css + simpr.css + mobile.css + compact.css, merged and pruned.
         headers.css stays separate: it is shared with the other tools. -->
    <link rel="stylesheet" href="./css/simpr-main.css">
    <link rel="stylesheet" href="./css/headers.css">
</head>
<body>
    <!-- Main container with max-width constraint -->
    <div class="app-container">
        <!-- Header inside container -->
        <header class="header-bar">
            <div class="header-title">
                <span>🧬</span> SIMPR Horsey Genome Editor
            </div>
            <div class="tools-dropdown" id="toolsDropdown">
                <button class="tools-btn" id="toolsBtn">
                    🔧 Tools <span class="arrow">▼</span>
                </button>
                <div class="dropdown-menu" id="dropdownMenu">
                    <!-- Populated by headers.js -->
                </div>
            </div>
        </header>

        <!-- Three-column layout -->
        <div class="app-layout">
            <!-- LEFT SIDEBAR -->
            <div class="left-sidebar">
                <div class="controls-section">
                    <div class="btn-group">
                        <button id="pasteBtn" class="primary">PASTE</button>
                        <button id="exportBtn" class="success">COPY</button>
                    </div>
                </div>

                <div class="textarea-section">
                    <label>✏️ GENE DATA (To edit)</label>
                    <div class="textarea-with-clear">
                        <textarea id="rawGeneInput" rows="14" placeholder='Example:
0:ATATGGCTTC
0:CTATGGACTC
1:TATAGCAACCTCA
1:TATAGCAACCTCA'></textarea>
                        <div class="dna-warnings" id="dnaWarnings" style="display:none;"></div>
                        <span class="textarea-actions">
                            <a id="dnaShortenerLink" href="#" target="_self">To DNA Shortener</a>
                            <button id="clearRawBtn" class="clear-btn clear-textarea-btn">✖ Clear</button>
                        </span>
                    </div>
                </div>

                <!-- GO TO HELIX (moved from right sidebar) -->
                <div class="helix-nav" style="padding:16px; border-bottom:1px solid #2d3a46;">
                    <h3>📑 GO TO HELIX (0–19)</h3>
                    <div class="helix-buttons" id="helixNavButtons"></div>
                </div>

                <!-- REMOVE DIVERSITY BUTTON -->
                <div class="controls-section" style="border-top: none; padding-top: 8px; padding-bottom: 16px">
                    <div class="btn-group" style="flex-direction: column; gap: 8px;">
                        <button id="removeDiversityBtn" title="Merge genes where possible, without changing the horse (except antler/hat and skin patterns)" class="diversity-remove" style="background: #8b5a2b; border-bottom-color: #d49b3a;">🧬 REMOVE DIVERSITY</button>
                        <button id="randomDiversityBtn" title="Randomize the genes where possible without changing the horse (except antler/hat and skin patterns)" class="random-diversity" style="background: #2b6e4c; border-bottom-color: #67b886;">🎲 RANDOM DIVERSITY</button>
                    </div>
                </div>
                  <footer>
    <a href="https://github.com/ZyonixGaming/dna" target="_blank" rel="noopener noreferrer">
      <svg data-component="Octicon" aria-hidden="true" focusable="false" class="octicon octicon-mark-github" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" display="inline-block" overflow="visible" style="vertical-align:text-bottom"><path d="M10.226 17.284c-2.965-.36-5.054-2.493-5.054-5.256 0-1.123.404-2.336 1.078-3.144-.292-.741-.247-2.314.09-2.965.898-.112 2.111.36 2.83 1.01.853-.269 1.752-.404 2.853-.404 1.1 0 1.999.135 2.807.382.696-.629 1.932-1.1 2.83-.988.315.606.36 2.179.067 2.942.72.854 1.101 2 1.101 3.167 0 2.763-2.089 4.852-5.098 5.234.763.494 1.28 1.572 1.28 2.807v2.336c0 .674.561 1.056 1.235.786 4.066-1.55 7.255-5.615 7.255-10.646C23.5 6.188 18.334 1 11.978 1 5.62 1 .5 6.188.5 12.545c0 4.986 3.167 9.12 7.435 10.669.606.225 1.19-.18 1.19-.786V20.63a2.9 2.9 0 0 1-1.078.224c-1.483 0-2.359-.808-2.987-2.313-.247-.607-.517-.966-1.034-1.033-.27-.023-.359-.135-.359-.27 0-.27.45-.471.898-.471.652 0 1.213.404 1.797 1.235.45.651.921.943 1.483.943.561 0 .92-.202 1.437-.719.382-.381.674-.718.944-.943"></path></svg>
      View source on GitHub
    </a>
  </footer>
            </div>

            <!-- MAIN TABLE AREA -->
            <div class="main-content" id="mainContent">
                <div class="filter-cell">
                    <label>🔍 Search: </label>
                    <input type="text" id="filterInput" class="filter-input" placeholder="" value="">
                    <button id="clearFilterBtn" class="clear-filter-btn">✖</button>
                </div>
                <div class="compare-bar" id="compareBar" style="display:none;">
                    <span class="compare-bar-label" id="compareBarLabel"></span>
                    <button class="compare-bar-diff" id="compareDiffToggle" title="Show only the genes whose value differs from the reference">Differences only</button>
                    <button class="compare-bar-exit" id="compareBarExit" title="Exit compare mode">✖</button>
                </div>
                <div class="table-wrapper">
                    <table class="gene-table" id="geneTable">
                        <thead id="dynamicThead"></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>

            <!-- RIGHT SIDEBAR: Bookmarks + DNA Library -->
            <div class="right-sidebar">
                <div class="mods-section">
                    <h3>🛠 MODIFICATIONS</h3>
                    <div class="mod-grid" id="modGrid"></div>
                </div>

                <div class="presets-section">
                    <h3 class="collapsible-header" id="presetsToggle">
                        <span class="chevron">▼</span> 🧪 PRESETS
                    </h3>
                    <div class="presets-body" id="presetsBody">
                        <div class="preset-filter-wrap">
                            <input type="text" id="presetFilter" class="preset-filter" placeholder="Filter populations…">
                            <button id="presetFilterClear" class="preset-filter-clear" title="Clear filter">✖</button>
                        </div>
                        <div class="preset-list" id="presetList">
                            <div class="presets-empty">No presets loaded.</div>
                        </div>
                    </div>
                </div>

                <div class="saved-dna-section">
                    <h3>📁 DNA Library</h3>
                    <div class="library-controls">
                        <button id="addCategoryBtn"><span>➕</span> Add Category</button>
                        <button id="saveDnaBtn"><span>💾</span> <span id="saveBtnText">Save DNA</span></button>
                    </div>
                    <ul class="category-list" id="categoryList"></ul>
                    <div class="import-export-btns">
                        <button id="exportLibBtn"><span>⬇️</span> Export</button>
                        <button id="importLibBtn"><span>⬆️</span> Import</button>
                    </div>
                </div>
                <div class="customdata-section">
                    <h3 class="collapsible-header" id="customDataToggle">
                        <span class="chevron">▼</span> ⚙️ CUSTOM DATA
                    </h3>
                    <div class="customdata-body" id="customDataBody">
                        <div class="custom-file-row">
                            <label for="genesXmlInput">genes.xml</label>
                            <input type="file" id="genesXmlInput" accept=".xml">
                        </div>
                        <div class="custom-file-row">
                            <label for="popXmlInput">pop.xml</label>
                            <input type="file" id="popXmlInput" accept=".xml">
                        </div>
                        <div class="custom-status" id="customDataStatus"></div>
                        <button id="resetCustomDataBtn">↺ Reset to bundled data</button>
                    </div>
                </div>

                <input type="file" id="importFileInput" accept=".json" style="display:none">
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>
    <button id="mobileRightToggle" title="Bookmarks &amp; Library">📑</button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Kept separate because other pages share them, and because both carry a
         large inlined XML fallback used when fetch() cannot read ./data/:
           genes.js  crispr.html + DNA Shortener; also encodeSequences/decodeToLines
           pop.js    pop.html + the save-editor pages
         pop.js must come before the bundle, which uses defaultWeights,
         loadPopDataFromXml and window.popData. -->
    <script src="./js/genes.js"></script>
    <script src="./js/headers.js"></script>
    <script src="./js/pop.js"></script>
    <!-- crispr.js + simpr.js + simpr-pop.js + compact.js + mobile.js, merged
         and de-duplicated. Edit js/simpr-main.js, then regenerate with:
             npx terser js/simpr-main.js -c -m -o js/simpr-main-min.js -->
    <script src="./js/simpr-main-min.js"></script>
</body>
</html>
