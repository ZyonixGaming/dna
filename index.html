<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="folder.ico">
  <title>DNA Shortener</title>
  <link rel="stylesheet" href="./css/horse-render.css">
  <style>
    * { box-sizing: border-box; }
    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      margin: 0;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
      gap: 2rem;
    }
    .container {
      max-width: 800px;
      width: 100%;
      background: #1e293b;
      border-radius: 1.2rem;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
      padding: 2rem 2.2rem;
    }
    h1 {
      font-weight: 600;
      margin: 0 0 0.2rem;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .link-area {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 0.7rem;
      padding: 0.6rem 0.9rem;
      margin: 1rem 0 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }
    .link-area input {
      flex: 1;
      border: 1px solid #475569;
      border-radius: 0.5rem;
      padding: 0.45rem 0.7rem;
      font-family: 'JetBrains Mono', monospace;
      background: #1e293b;
      color: #f1f5f9;
      font-size: 0.85rem;
      min-width: 220px;
    }
    .button-row {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 0.55rem 1.1rem;
      border-radius: 0.7rem;
      font-weight: 500;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      white-space: nowrap;
    }
    button:hover { background: #2563eb; transform: translateY(-1px); }
    button.ghost { background: #334155; color: #cbd5e1; }
    button.ghost:hover { background: #475569; }
    .dna-editor {
      width: 100%;
      min-height: 280px;
      max-height: 500px;
      overflow-y: auto;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 0.95rem;
      padding: 0.9rem;
      border: 1px solid #475569;
      border-radius: 0.8rem;
      background: #0f172a;
      color: #e2e8f0;
      line-height: 1.6;
      margin-top: 0.4rem;
      white-space: pre-wrap;
      word-break: break-all;
      outline: none;
      position: relative;
    }
    .dna-editor:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59,130,246,0.3);
    }
    .dna-editor.empty::before {
      content: attr(data-placeholder);
      color: #64748b;
      pointer-events: none;
      position: absolute;
      top: 0.9rem;
      left: 0.9rem;
      opacity: 0.6;
    }
    .error-msg {
      color: #fca5a5;
      background: #7f1d1d;
      padding: 0.6rem 1rem;
      border-radius: 0.6rem;
      font-size: 0.9rem;
      margin: 0.5rem 0 0.2rem;
      display: none;
    }
    .small-note {
      font-size: 0.8rem;
      color: #94a3b8;
      margin: 0.2rem 0 0;
    }
    .dna-editor .base-A { color: #facc15; font-weight: 600; }
    .dna-editor .base-C { color: #60a5fa; font-weight: 600; }
    .dna-editor .base-G { color: #4ade80; font-weight: 600; }
    .dna-editor .base-T { color: #f87171; font-weight: 600; }

    /* CRISPR link */
    .crispr-link-area {
      margin-top: 0.6rem;
      margin-bottom: 1rem;
    }
    .crispr-link-area a {
      color: #60a5fa;
      text-decoration: none;
      font-size: 0.8rem;
    }
    .crispr-link-area a:hover {
      text-decoration: underline;
    }
    .crispr-link-area { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .crispr-link-area .tool-link { display: inline-flex; align-items: center; gap: 0.35rem; }
    .crispr-link-area .tool-link img { width: 16px; height: 16px; }

    footer {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.85rem;
      color: #94a3b8;
    }
    footer a { color: #60a5fa; text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    /* Sidebar */
    .sidebar {
      width: 320px;
      background: #1e293b;
      border-radius: 1.2rem;
      padding: 1.5rem;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-height: calc(100vh - 4rem);
      overflow-y: auto;
    }
    .sidebar h2 {
      font-size: 1.2rem;
      margin: 0;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .category-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .category-item {
      background: #0f172a;
      border-radius: 0.6rem;
      padding: 0.4rem 0.6rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      transition: background 0.2s, border-color 0.2s;
      border: 2px solid transparent;
    }
    .category-item.selected {
      border-color: #3b82f6;
      background: #1e2a3a;
    }
    .category-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
    }
    .category-name {
      flex: 1;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .category-actions {
      display: flex;
      gap: 0.2rem;
      align-items: center;
    }
    .category-actions button {
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      padding: 0.2rem;
      font-size: 0.8rem;
    }
    .category-actions button:hover { color: #f1f5f9; }
    .entry-list {
      list-style: none;
      padding-left: 1rem;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }
    .entry-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.2rem 0.4rem;
      background: #1e293b;
      border-radius: 0.4rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .entry-item:hover { background: #334155; }
    .entry-name {
      flex: 1;
      font-size: 0.85rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .entry-actions {
      display: flex;
      gap: 0.2rem;
      align-items: center;
    }
    .entry-actions button {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 0.1rem;
      font-size: 0.7rem;
    }
    .entry-actions button:hover { color: #f1f5f9; }
    /* Library search (js/dna-library.js) */
    .library-search { display: flex; gap: 0.4rem; }
    .library-search input {
      flex: 1; min-width: 0;
      border: 1px solid #475569; border-radius: 0.5rem;
      padding: 0.35rem 0.6rem; background: #0f172a; color: #f1f5f9; font-size: 0.8rem;
    }
    .library-search input:focus { outline: none; border-color: #3b82f6; }
    .library-search button { padding: 0.2rem 0.6rem; }
    .lib-match { background: #3b82f655; color: inherit; border-radius: 2px; padding: 0 1px; }
    .library-empty { list-style: none; padding: 0.5rem; color: #64748b; font-size: 0.8rem; font-style: italic; }
    #saveDnaBtn:disabled { opacity: 0.5; cursor: not-allowed; }
    /* Pop (js/pop-presets.js) */
    .pop-toggle { cursor: pointer; user-select: none; display: flex; align-items: center; gap: 0.4rem; }
    .pop-toggle .chevron { font-size: 0.7rem; color: #64748b; transition: transform 0.15s; }
    .pop-toggle.collapsed .chevron { transform: rotate(-90deg); }
    #popBody { display: flex; flex-direction: column; gap: 0.5rem; }
    .preset-list { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
    .preset-row {
      display: flex; align-items: center; gap: 0.4rem; padding: 0.3rem 0.5rem;
      background: #0f172a; border-radius: 0.5rem; cursor: pointer; font-size: 0.8rem;
    }
    .preset-row:hover { background: #334155; }
    .preset-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .preset-dot { color: #22c55e; font-size: 0.75rem; }
    .preset-dot.invalid { color: #64748b; }
    .presets-empty { color: #64748b; font-size: 0.8rem; font-style: italic; padding: 0.3rem; }
    .sidebar-controls {
      display: flex;
      gap: 0.5rem;
      flex-wrap: nowrap;
    }
    .sidebar-controls button {
      flex: 1 1 0; min-width: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .drag-handle {
      cursor: grab;
      color: #64748b;
      font-size: 0.9rem;
      user-select: none;
    }
    .drag-handle:active { cursor: grabbing; }
    .category-item.dragging, .entry-item.dragging { opacity: 0.4; }

    .import-export-btns {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    /* Toast */
    .toast-container {
      position: fixed;
      top: 1rem;
      right: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      z-index: 1000;
    }
    .toast {
      background: #1e293b;
      color: #e2e8f0;
      padding: 0.7rem 1rem;
      border-radius: 0.5rem;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      animation: slideIn 0.3s ease;
      min-width: 200px;
    }
    .toast.success { border-left: 4px solid #4ade80; }
    .toast.error { border-left: 4px solid #f87171; }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

/* Floating toggle button – hidden on desktop */
#mobileRightToggle {
    display: none;
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 110;
    background: #2c6e6e;
    color: white;
    border: none;
    border-radius: 50%;
    width: 52px;
    height: 52px;
    font-size: 1.4rem;
    cursor: pointer;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
    align-items: center;
    justify-content: center;
}

/* Overlay – hidden by default */
.sidebar-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.45);
    z-index: 98;
}

/* ---- Mobile breakpoint ---- */
@media (max-width: 900px) {

    /* Shrink left sidebar */
    .left-sidebar {
        width: 160px;
    }

    /* Right sidebar becomes a fixed floating panel */
    .sidebar {
        position: fixed;
        top: 0;
        right: -320px;              /* hidden off‑screen */
        width: 300px;
        max-width: 85vw;            /* avoid overflow on small phones */
        height: 100%;
        transition: right 0.3s ease;
        z-index: 99;
        box-shadow: -4px 0 16px rgba(0, 0, 0, 0.5);
        overflow-y: auto;
    }

    .sidebar.open {
        right: 0;
    }

    /* Show the toggle button */
    #mobileRightToggle {
        display: flex;
    }

    /* Overlay visible when sidebar is open */
    .sidebar-overlay.active {
        display: block;
    }
}

<div class="container">

..."></div>

<script src="./js/horse-render.js"></script>
<!-- Shared modules (also used by simpr.html and visual/; see common-modules.md) -->

<script>
  (function() {

	// Relative, so they work locally and when deployed next to this page (deploy.cmd).
	const simprUrl = "./simpr.html"
	const visualUrl = "./visual/index.html"


    function colorizeDNA(plainText) {
      return plainText.replace(/([ACGT])/g, '<span class="base-$1">$1</span>');
    }

    // ---------- DOM elements ----------
    const editor = document.getElementById('rawGeneInput');
    const linkDisplay = document.getElementById('linkDisplay');
    const errorDiv = document.getElementById('errorMessage');
    const copyLinkBtn = document.getElementById('copyLinkBtn');
    const copyTextBtn = document.getElementById('copyTextBtn');
    const pasteTextBtn = document.getElementById('pasteTextBtn');
    const toastContainer = document.getElementById('toastContainer');
	const simprLink = document.getElementById('simprLink');
	const visualLink = document.getElementById('visualLink');

    // SIMPR / Visual Editor links carry the genome when there is a valid one
    // (same tab), otherwise they open the empty tool in a new tab - as before.
    function setToolLinks(encoded) {
      const q = encoded ? `?dna=${encoded}` : '';
      const target = encoded ? '_self' : '_blank';      
      simprLink.href = simprUrl + q;
      visualLink.href = visualUrl + q;
    }

    // ---------- Toast ----------
    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      toastContainer.appendChild(toast);
      setTimeout(() => {
        toast.style.transition = 'opacity 0.3s';
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    // ---------- DNA Library ----------
    // js/dna-library.js, shared with SIMPR and the visual editor. Same storage key
    // ('dna_shortener_categories') and BroadcastChannel ('dna-shortener-sync') as
    // before. Created on load (see Initialization). No ⚖️ compare here.
    let library = null;
    let pop = null;      // js/pop-presets.js - click a population to generate a genome

    // The editor's genome as allele pairs for Pop's validity dots (strict: only a
    // complete genome is checked).
    function genePairs() {
      if (typeof arrayHp === 'undefined' || !arrayHp[0] || !arrayHp[0][0]) return [];
      const r = GenomeText.normalize(editor.innerText, { fill: false });
      if (!r.lines) return [];
      const out = [];
      for (let h = 0; h < 20; h++) {
        const a = r.lines[h * 2].slice(3), b = r.lines[h * 2 + 1].slice(3);
        for (let p = 0; p < arrayHp[h].length; p++) {
          const e = arrayHp[h][p];
          out.push({ desc: e.desc, n: e.n, allele1: a.charAt(p), allele2: b.charAt(p) });
        }
      }
      return out;
    }

    // ---------- UI update ----------
    function updatePlaceholder() {
      const text = editor.innerText.trim();
      editor.classList.toggle('empty', text === '');
    }

    function getTextAndCursor(div) {
      const sel = window.getSelection();
      if (!sel.rangeCount) return { text: div.innerText, offset: 0 };
      const range = sel.getRangeAt(0);
      const preCaretRange = range.cloneRange();
      preCaretRange.selectNodeContents(div);
      preCaretRange.setEnd(range.endContainer, range.endOffset);
      return { text: div.innerText, offset: preCaretRange.toString().length };
    }

    function setCursor(div, offset) {
      const sel = window.getSelection();
      const range = document.createRange();
      let currentPos = 0;
      const treeWalker = document.createTreeWalker(div, NodeFilter.SHOW_TEXT, null, false);
      let node;
      while ((node = treeWalker.nextNode())) {
        const length = node.textContent.length;
        if (currentPos + length >= offset) {
          range.setStart(node, offset - currentPos);
          range.setEnd(node, offset - currentPos);
          sel.removeAllRanges();
          sel.addRange(range);
          return;
        }
        currentPos += length;
      }
      range.selectNodeContents(div);
      range.collapse(false);
      sel.removeAllRanges();
      sel.addRange(range);
    }

    // Editor text: upper case, "00: ACGT" -> "00:ACGT", any other separator -> newline.
    // Only [ACGT0-9:\n] survive, which also makes colorizeDNA's HTML safe.
    function cleanDnaText(text) {
      return String(text)
        .toUpperCase()
        .replace(/[ \t]*:[ \t]*/g, ':')
        .replace(/[^ACGT0-9:\n]+/g, '\n')
        .replace(/\n{2,}/g, '\n')
        .replace(/^\n+|\n+$/g, '');
    }

    // A pasted DNA code or ?dna= link becomes the 40 lines it encodes; null if the
    // text is not one.
    function decodePastedCode(text) {
      const code = GenomeText.extractDnaParam(text) || (GenomeText.looksEncoded(text) ? text.trim() : null);
      if (!code) return null;
      try { return GenomeText.decode(code).join('\n'); } catch (e) { return null; }
    }

    function refreshEditorContent(preserveCursor = true) {
      const { text, offset } = getTextAndCursor(editor);
		const cleaned = cleanDnaText(text);
      editor.innerHTML = colorizeDNA(cleaned);
      if (preserveCursor) setCursor(editor, Math.min(offset, cleaned.length));
      updatePlaceholder();
      return cleaned;
    }

    function showError(msg) {
      errorDiv.style.display = 'block';
      errorDiv.textContent = '❌ ' + msg;
    }
    function hideError() {
      errorDiv.style.display = 'none';
      errorDiv.textContent = '';
    }

    function updateUrlParam(encoded) {
      const base = window.location.href.split('?')[0];
      history.replaceState(null, '', encoded ? `${base}?dna=${encoded}` : base);
    }

    function refreshLink() {
      if (pop) pop.genomeChanged();
      const plainText = editor.innerText.trim();
      if (!plainText) {
        linkDisplay.value = '';
        updateUrlParam('');
        setToolLinks('');
        hideError();
        return;
      }
      // GenomeText in strict mode: any layout, but a missing helix or a strand of the
      // wrong length is an error - the shortener never invents bases.
      const parsed = GenomeText.normalize(plainText, { fill: false });
      try {
        if (!parsed.lines) {
          const more = parsed.errors.length > 1 ? ` (+${parsed.errors.length - 1} more)` : '';
          errorDiv.title = parsed.errors.join('\n');
          throw new Error(parsed.errors[0] + more);
        }
        errorDiv.title = '';
        const encoded = GenomeText.encode(parsed.lines);
        const fullUrl = `${window.location.href.split('?')[0]}?dna=${encoded}`;
        linkDisplay.value = fullUrl;
        updateUrlParam(encoded);
        // Update CRISPR editor link with compressed DNA
        setToolLinks(encoded);
        hideError();
      } catch (e) {
        showError(e.message);
        linkDisplay.value = '';
        updateUrlParam('');
        setToolLinks('');
      }
    }

    function loadEntry(entry) {
      editor.innerHTML = colorizeDNA(cleanDnaText(entry.dnaText));
      updatePlaceholder();
      refreshLink();
      showToast(`Loaded DNA "${entry.name}"`);
    }

    // ---------- Main event listeners ----------
    editor.addEventListener('input', function(e) {
      if (editor.dataset.updating === 'true') return;
      editor.dataset.updating = 'true';
      refreshEditorContent(true);
      refreshLink();
      editor.dataset.updating = 'false';
    });

    editor.addEventListener('paste', function(e) {
      e.preventDefault();
      const clipboardData = (e.clipboardData || window.clipboardData);
      if (!clipboardData) return;
      const pastedText = clipboardData.getData('text/plain');
      const decoded = decodePastedCode(pastedText);
      if (decoded) {
        // a DNA code or link replaces the whole genome
        editor.innerHTML = colorizeDNA(decoded);
        updatePlaceholder();
        refreshLink();
        showToast('DNA code decoded');
        return;
      }
      const sel = window.getSelection();
      if (!sel.rangeCount) return;
      const range = sel.getRangeAt(0);
      range.deleteContents();
		const cleaned = cleanDnaText(pastedText);   // any separator (space, tab, comma, |…) → newline
      const textNode = document.createTextNode(cleaned);
      range.insertNode(textNode);
      range.setStartAfter(textNode);
      range.collapse(true);
      sel.removeAllRanges();
      sel.addRange(range);
      editor.dataset.updating = 'true';
      refreshEditorContent(true);
      refreshLink();
      editor.dataset.updating = 'false';
    });

    copyLinkBtn.addEventListener('click', () => {
      if (linkDisplay.value) {
        navigator.clipboard.writeText(linkDisplay.value).then(() => {
          copyLinkBtn.innerHTML = '<span>✅</span> Copied!';
          setTimeout(() => { copyLinkBtn.innerHTML = '<span>📋</span> Copy Link'; }, 1500);
        }).catch(() => { linkDisplay.select(); document.execCommand('copy'); });
      }
    });
    copyTextBtn.addEventListener('click', () => {
      const plain = editor.innerText;
      navigator.clipboard.writeText(plain).then(() => {
        copyTextBtn.innerHTML = '<span>✅</span> Copied!';
        setTimeout(() => { copyTextBtn.innerHTML = '<span>📄</span> Copy DNA'; }, 1500);
      }).catch(() => {
        const range = document.createRange();
        range.selectNodeContents(editor);
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
        document.execCommand('copy');
      });
    });
    pasteTextBtn.addEventListener('click', async () => {
      try {
        const text = await navigator.clipboard.readText();
        const cleaned = decodePastedCode(text) || cleanDnaText(text);

        editor.innerHTML = colorizeDNA(cleaned);
        const range = document.createRange();
        range.selectNodeContents(editor);
        range.collapse(false);
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
        updatePlaceholder();
        refreshLink();
        hideError();
        pasteTextBtn.innerHTML = '<span>✅</span> Pasted!';
        setTimeout(() => { pasteTextBtn.innerHTML = '<span>📥</span> Paste DNA'; }, 1500);
      } catch (err) { showError('Unable to read clipboard. Please paste manually.'); }
    });

    // ---------- Initialization ----------
    function loadFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const dna = params.get('dna');
      if (dna) {
        try {
          const lines = GenomeText.decode(dna);
          editor.innerHTML = colorizeDNA(lines.join('\n'));
          linkDisplay.value = window.location.href;
          updatePlaceholder();
          hideError();
          showToast('DNA loaded from link');
          return true;
        } catch (e) {
          showError('Failed to decode link: ' + e.message);
          editor.innerHTML = '';
          linkDisplay.value = '';
          updatePlaceholder();
        }
      } else {
        editor.innerHTML = '';
        updatePlaceholder();
        linkDisplay.value = '';
      }
      return false;
    }

    window.addEventListener('load', async () => {
      loadFromUrl();
      library = DnaLibrary.create({
        listEl: '#categoryList', addCategoryBtn: '#addCategoryBtn',
        saveBtn: '#saveDnaBtn', saveBtnText: '#saveBtnText',
        exportBtn: '#exportBtn', importBtn: '#importBtn', importInput: '#importFileInput',
        searchInput: '#librarySearch', searchClear: '#librarySearchClear',
        getGenome: () => editor.innerText,
        loadGenome: (text, entry) => loadEntry(entry),
        toast: (msg, kind) => showToast(msg, kind === 'error' || kind === 'warn' ? 'error' : 'success')
      });
      library.render();
      // Open with the first category selected, as before; clicking it again
      // collapses every category.
      const cats = library.getCategories();
      if (cats.length) library.select(cats[0].id);
      // Ensure the CRISPR link reflects current state
      refreshLink();

      // Horse preview background (remembered for the Shortener only)
      PreviewBg.attach({ bar: '#previewBg', target: '.render-col .horse-stage', storageKey: 'shortener_preview_bg' });

      // Pop: the bundled genes.xml / pop.xml (this page has no Custom Data panel).
      pop = PopPresets.create({
        listEl: '#popList', filterInput: '#popFilter', filterClear: '#popFilterClear',
        headerEl: '#popToggle', bodyEl: '#popBody', collapseKey: 'shortener_pop_open',
        popXmlUrl: './data/pop.xml',
        loadGenome: (text, row) => {
          editor.innerHTML = colorizeDNA(cleanDnaText(text));
          updatePlaceholder();
          refreshLink();
          showToast(`Generated from ${row.name}`);
        },
        // no compare / odds on this page
        getGenePairs: genePairs,
        toast: (msg, kind) => showToast(msg, kind === 'error' || kind === 'warn' ? 'error' : 'success')
      });
      try {
        await loadGeneDataFromXml();
        await loadPopDataFromXml();
        await pop.reload();
      } catch (e) {
        console.error('Pop failed to load', e);
      }
    });
  })();
  
  // Mobile sidebar toggle logic
(function () {
    const toggleBtn = document.getElementById('mobileRightToggle');
    const rightSidebar = document.querySelector('.sidebar');
    const overlay = document.getElementById('sidebarOverlay');

    if (!toggleBtn || !rightSidebar) return;

    function openSidebar() {
        rightSidebar.classList.add('open');
        if (overlay) overlay.classList.add('active');
    }

    function closeSidebar() {
        rightSidebar.classList.remove('open');
        if (overlay) overlay.classList.remove('active');
    }

    toggleBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (rightSidebar.classList.contains('open')) {
            closeSidebar();
        } else {
            openSidebar();
        }
    });

    if (overlay) {
        overlay.addEventListener('click', closeSidebar);
    }

    // Auto‑close if window is resized back to desktop width
    window.addEventListener('resize', function () {
        if (window.innerWidth > 900) {
            rightSidebar.classList.remove('open');
            if (overlay) overlay.classList.remove('active');
        }
    });
})();
</script>
