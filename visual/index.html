<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visual Genome Editor</title>
<link rel="icon" type="image/x-icon" href="../horse.ico">
<!-- shared with the other tools; the inline <style> below comes after, so it wins ties -->
<link rel="stylesheet" href="../css/headers.css">
<link rel="stylesheet" href="../css/sidebar-panels.css">
<style>
:root{
  --bg:#1a1a1c; --panel:#242428; --panel2:#2a2a2e; --panel3:#303034;
  --border:#3a3a3e; --text:#e0e0e2; --dim:#909096;
  --accent:#6ea8fe; --accent2:#3d6fb8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh}
/* Header: css/headers.css's .header-bar + tool switcher, retinted to this page */
.app-header{padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--border);box-shadow:none;font-weight:600;justify-content:flex-start;gap:12px}
.app-header .header-title{font-size:15px;color:var(--text);gap:8px;white-space:nowrap}
.app-header .header-title span{font-size:18px}
.app-header .spacer{flex:1}
.app-header > button{font-size:12px;padding:4px 10px}
.app-header .tools-btn{padding:4px 14px;font-size:12px}

/* Section navigation bar */
.section-nav{display:flex;gap:2px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0;scrollbar-width:thin}
.section-nav::-webkit-scrollbar{height:6px}
.section-nav::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.nav-btn{background:transparent;border:1px solid transparent;color:var(--dim);font-size:11px;padding:3px 10px;border-radius:3px;cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:inherit}
.nav-btn:hover{background:var(--panel3);color:var(--text)}
.nav-btn:active{background:var(--accent2);color:#fff}

/* Editor | splitter | side panel. --side-w is set by the splitter (editor-app.js) and remembered. */
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 6px var(--side-w,520px);min-height:0}
.editor-panel{overflow-y:auto;padding-bottom:120px;min-width:0}
.splitter{cursor:col-resize;background:var(--border);opacity:.35;touch-action:none;user-select:none}
.splitter:hover,.splitter.dragging{opacity:1;background:var(--accent2)}
body.resizing{cursor:col-resize;user-select:none}
body.resizing iframe,body.resizing canvas{pointer-events:none}
.side-panel{background:var(--panel);overflow-y:auto;display:flex;flex-direction:column;min-width:0}
.side-panel>*{flex-shrink:0}
/* The preview is never taller than it is wide, and the canvas never exceeds the preview: the
   canvas keeps its rendered pixel size until that would overflow, then scales down. The wrap
   is a size container, so inside it 100cqw = its content width (W - 2*12px padding); capping
   the canvas height there makes the wrap's height at most 24 + (W - 24 - 1) + 1 = W. */
.preview-wrap{padding:12px;background:#a522b4;border-bottom:1px solid var(--border);min-height:180px;overflow:hidden;display:flex;align-items:center;justify-content:center;container-type:inline-size}
.preview-wrap canvas{display:block;max-width:100%;max-height:calc(100cqw - 1px);width:auto;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
.dims{font-size:11px;color:var(--dim);padding:4px 12px}
.tags-panel{padding:8px 12px;border-bottom:1px solid var(--border);font-size:11px;line-height:1.6;color:var(--dim);max-height:130px;overflow-y:auto}
.tags-panel .tag{display:inline-block;background:var(--panel2);border:1px solid var(--border);border-radius:3px;padding:1px 5px;margin:1px 2px}
details.section{border-bottom:1px solid var(--border)}
details.section>summary{padding:8px 16px;cursor:pointer;user-select:none;font-weight:600;background:var(--panel2);list-style:none;display:flex;align-items:center;gap:8px}
details.section>summary::-webkit-details-marker{display:none}
details.section>summary::before{content:"▸";color:var(--dim);display:inline-block;transition:transform .12s}
details.section[open]>summary::before{transform:rotate(90deg)}
details.section>summary:hover{background:var(--panel3)}
details.section.nav-flash>summary{background:var(--accent2);color:#fff}
details.section.nav-flash>summary::before{color:#fff}
.section-rnd{margin-left:auto;font-size:10px;padding:2px 8px;flex-shrink:0;background:var(--panel);border:1px solid var(--border);color:var(--dim);border-radius:3px}
.section-rnd:hover{background:var(--accent2);color:#fff;border-color:var(--accent2)}
details.section>summary>span{flex:1;margin-left:8px}
.controls{padding:6px 0 10px}
.control{display:grid;grid-template-columns:160px 1fr 56px;gap:8px;padding:3px 16px;align-items:center}
.control-label{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.control-label.combined{color:var(--accent)}
.control-value{font-size:11px;text-align:right;font-variant-numeric:tabular-nums;color:var(--text)}
.control-input{display:flex;align-items:center;gap:6px}
.control-input input[type=range]{flex:1;width:100%;accent-color:var(--accent)}
.control-input input[type=checkbox]{accent-color:var(--accent)}
.control-input select{flex:1;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:3px;padding:2px 6px;font:inherit;font-size:12px}
.control-hint{font-size:10px;color:var(--dim);grid-column:2 / span 2;padding:0 0 2px;font-style:italic}

/* Annotation / requirement row */
.control-annotation{grid-column:2 / span 2;padding:0 0 3px;display:none}
.control-annotation.visible{display:block}
.control-annotation>span{display:inline-block;font-size:9px;padding:1px 6px;border-radius:3px;background:#4a3520;color:#f0c070;white-space:normal;line-height:1.35}

.badge{display:inline-block;font-size:9px;padding:1px 5px;border-radius:3px;background:var(--accent2);color:#fff;margin-left:6px;vertical-align:middle;letter-spacing:.5px}
/* Advanced section */
.advanced-section{margin:8px 16px 4px;border:1px solid var(--border);border-radius:4px;background:var(--panel)}
.advanced-section>summary{padding:6px 12px;cursor:pointer;user-select:none;font-size:11px;color:var(--dim);list-style:none;display:flex;align-items:center;gap:6px}
.advanced-section>summary::-webkit-details-marker{display:none}
.advanced-section>summary::before{content:"▸";display:inline-block;transition:transform .12s;font-size:10px}
.advanced-section[open]>summary::before{transform:rotate(90deg)}
.advanced-section>summary:hover{color:var(--text)}
.advanced-controls{padding:4px 0}
.advanced-controls .control{opacity:0.85}
/* Color dropdown with swatch */
.color-select-wrap{display:flex;align-items:center;gap:6px;flex:1}
.color-select-wrap select{flex:1}
.color-swatch{width:14px;height:14px;border-radius:2px;border:1px solid var(--border);flex-shrink:0}
/* Control group (collapsible) */
.control-group{margin:8px 12px 4px;border:1px solid var(--border);border-radius:4px;background:var(--panel2)}
.control-group-header{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--accent);cursor:pointer;user-select:none;list-style:none}
.control-group-header::-webkit-details-marker{display:none}
.control-group-header::before{content:"▸";display:inline-block;transition:transform .12s;font-size:10px;color:var(--dim)}
.control-group[open]>.control-group-header::before{transform:rotate(90deg)}
.control-group[open]>.control-group-header{border-bottom:1px solid var(--border)}
.control-group-label{flex:1}
.group-swatch{width:20px;height:20px;border-radius:3px}
.control-group-children{padding:4px 0}
.control-group-children .control{padding:3px 12px}
/* Search input */
.search-input{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:3px;padding:4px 8px;width:140px;font-size:12px}
.search-input:focus{outline:none;border-color:var(--accent)}
.search-wrap{position:relative;display:inline-flex;align-items:center}
.search-wrap .search-input{padding-right:24px;width:160px}
.search-clear{display:none;position:absolute;right:4px;top:50%;transform:translateY(-50%);width:16px;height:16px;padding:0;border:0;border-radius:50%;background:var(--panel3);color:var(--dim);font-size:13px;line-height:14px;text-align:center;cursor:pointer;font-family:inherit}
.search-clear:hover{background:var(--accent2);color:#fff}
.search-wrap.has-value .search-clear{display:block}
.control.hidden,.control-group.hidden{display:none}
.section.no-matches>.controls{display:none}
.section.no-matches>summary::after{content:' (no matches)';color:var(--dim);font-weight:400}
/* Export button */
.export-wrap{padding:0;text-align:center}
/* Color picker */
.color-picker-wrap{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.color-palette{display:flex;flex-wrap:wrap;gap:2px;max-width:200px}
.palette-swatch{width:18px;height:18px;border:1px solid var(--border);border-radius:2px;cursor:pointer;padding:0}
.palette-swatch:hover{border-color:var(--accent);transform:scale(1.15)}
.color-any{width:28px;height:28px;padding:0;border:1px solid var(--border);cursor:pointer}
.current-color{width:24px;height:24px;border-radius:3px}
/* Skin picker */
.skin-picker-wrap{display:grid;grid-template-columns:repeat(4,20px);gap:2px}
.skin-swatch{width:20px;height:20px;border:1px solid var(--border);border-radius:2px;cursor:pointer;padding:0}
.skin-swatch:hover{border-color:var(--accent);transform:scale(1.15)}
.skin-swatch.skin-active{border:2px solid #fff;box-shadow:0 0 4px var(--accent)}
/* Preview toolbar */
.preview-toolbar{display:flex;align-items:center;gap:6px;padding:4px 12px;font-size:11px;color:var(--dim);flex-wrap:wrap}
.preview-toolbar label{font-size:10px;color:var(--dim)}
.preview-toolbar .export-wrap{padding:0}
.toolbar-sep{width:1px;height:16px;background:var(--border);margin:0 2px}
.bg-btn{width:20px;height:20px;border:2px solid var(--border);border-radius:2px;padding:0;cursor:pointer;font-size:8px;color:var(--dim);line-height:20px;text-align:center}
.bg-btn:hover,.bg-btn.active{border-color:var(--accent)}
.zoom-btn{font-size:10px;padding:1px 6px;background:var(--panel2);border:1px solid var(--border);color:var(--dim);border-radius:2px;cursor:pointer}
.zoom-btn:hover,.zoom-btn.active{background:var(--accent2);color:#fff;border-color:var(--accent2)}
textarea{width:100%;background:#101014;color:var(--text);border:1px solid var(--border);border-radius:3px;padding:8px;font:11px/1.5 ui-monospace,Consolas,monospace;resize:vertical;min-height:200px}
button{background:var(--accent2);color:#fff;border:0;border-radius:3px;padding:5px 12px;cursor:pointer;font:inherit;font-size:12px}
button:hover{background:var(--accent)}
button.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
button.ghost:hover{background:var(--panel3)}
.raw-wrap{padding:12px}
.raw-wrap .row{display:flex;gap:6px;margin-top:8px;align-items:center}
.status{font-size:11px;color:var(--dim);flex:1}
.status.error{color:#ff6b6b}
.section-controls>details>summary{font-size:12px}
/* Encoded DNA row */
.raw-wrap .code-row{display:none!important;}
.raw-wrap .links{font-size:11px;color:var(--dim);display:none!important;}
.code-row input{flex:1;min-width:0;background:#101014;color:var(--text);border:1px solid var(--border);border-radius:3px;padding:4px 6px;font:11px ui-monospace,Consolas,monospace}
.code-row input:focus{outline:none;border-color:var(--accent)}
.raw-wrap .links{font-size:11px;color:var(--dim)}
.raw-wrap .links a{color:var(--accent);text-decoration:none}
.raw-wrap .links a:hover{text-decoration:underline}
.status.warn{color:#f0c070;cursor:help}
/* Side-panel blocks (Pop / DNA Library / Custom Data): markup and classes come from the shared
   modules and css/sidebar-panels.css; these rules only fit them into this page. */
.panel-body{padding:10px 12px}
.panel-body .preset-list{max-height:260px;overflow-y:auto}
.library-controls,.import-export-btns{display:flex;gap:6px;margin:0 0 8px}
.library-controls button,.import-export-btns button{flex:1;font-size:11px;padding:4px 8px}
.library-controls button:disabled{opacity:.5;cursor:not-allowed;background:var(--panel3)}
.category-list{max-height:340px;overflow-y:auto}
.category-actions{display:flex;gap:2px}
.category-actions button,.entry-actions button,.preset-row button{background:transparent;border:0;padding:1px 4px;font-size:12px;color:var(--text)}
.category-actions button:hover,.entry-actions button:hover,.preset-row button:hover{background:var(--panel3)}
.entry-actions{display:flex;gap:2px}
.custom-file-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
#resetCustomDataBtn{margin-top:6px;font-size:11px}
.library-search{margin:0 0 8px}
.lib-match{background:#3d6fb888;color:inherit;border-radius:2px;padding:0 1px}
.library-empty{list-style:none;padding:8px;color:var(--dim);font-style:italic}
.toast.error{background:#7f1d1d}
.toast.warn{background:#78350f}
.toast.ok{background:#14532d}





</style>
</head>
<body>
<div class="app">
  <header class="header-bar app-header">
    <div class="header-title"><span>🐴</span> Visual Genome Editor</div>
        <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Filter genes..." class="search-input"/>
      <button type="button" id="btnClearSearch" class="search-clear" title="Clear filter" aria-label="Clear filter">×</button>
    </div>
    <span class="spacer"></span>
    <button id="btnExpandAll" class="ghost">Expand All</button>
    <button id="btnCollapseAll" class="ghost">Collapse All</button>
    <button id="btnRandomize" class="ghost">Randomize</button>
    <button id="btnReset" class="ghost">Reset</button>
    <button id="btnCopy">Copy DNA</button>
    <button id="btnPaste" class="ghost">Paste DNA</button>
    <div class="tools-dropdown" id="toolsDropdown">
      <button class="tools-btn" id="toolsBtn">🔧 Tools <span class="arrow">▼</span></button>
      <div class="dropdown-menu" id="dropdownMenu"><!-- populated by ../js/headers.js --></div>
    </div>
  </header>
  <nav class="section-nav" id="sectionNav" aria-label="Section navigation"></nav>
  <main>
    <div class="editor-panel" id="editorPanel"></div>
    <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" tabindex="0" title="Drag to resize · double-click to reset · ←/→ with focus"></div>
    <aside class="side-panel">
      <div class="preview-wrap">
        <canvas id="preview"></canvas>
      </div>
      <div class="dims" id="dims"></div>
      <div class="preview-toolbar">
        <div class="export-wrap"><button id="btnExport">Export PNG</button></div>
        <span class="toolbar-sep"></span>
        <label>BG:</label>
        <button class="bg-btn" data-bg="#777777" title="Grey" style="background:#777777"></button>
        <button class="bg-btn active" data-bg="#a522b4" title="Purple" style="background:#a522b4"></button>
        <button class="bg-btn" data-bg="#82d7ff" title="Game blue" style="background:#82d7ff"></button>
        <button class="bg-btn" data-bg="#ffffff" title="White" style="background:#fff"></button>
        <button class="bg-btn" data-bg="#1a1a1c" title="Dark" style="background:#1a1a1c"></button>
        <span class="toolbar-sep"></span>
        <label>Zoom:</label>
        <button class="zoom-btn" data-zoom="2">2x</button>
        <button class="zoom-btn active" data-zoom="4">4x</button>
        <button class="zoom-btn" data-zoom="6">6x</button>
        <button class="zoom-btn" data-zoom="8">8x</button>
      </div>
      <div class="tags-panel" id="tagsPanel"></div>
      <details class="section" open data-panel="raw">
        <summary>Raw Genome</summary>
        <div class="raw-wrap">
          <!-- accepts 40 HH:SEQ lines in any layout, a DNA code, or a ?dna= link -->
          <textarea id="rawGenome" spellcheck="false"></textarea>
          <div class="row">
            <button id="btnApplyRaw">Apply</button>
            <span class="status" id="rawStatus"></span>
          </div>
          <div class="row code-row">
            <input id="dnaCode" spellcheck="false" autocomplete="off" title="Encoded genome (base64url) - the same code SIMPR and the DNA Shortener use. Paste a code here and press Enter to load it.">
            <button id="btnLoadCode" class="ghost" title="Load the code in the box">Load</button>
            <button id="btnCopyCode" class="ghost">Copy code</button>
            <button id="btnCopyLink" class="ghost">Copy link</button>
          </div>
          <div class="row links">
            Open in <a id="lnkSimpr" href="../simpr.html" target="_blank" rel="noopener">SIMPR</a>
            · <a id="lnkShortener" href="../index.html" target="_blank" rel="noopener">DNA Shortener</a>
          </div>
        </div>
      </details>
      <details class="section" data-panel="pop">
        <summary>🧪 Pop</summary>
        <div class="panel-body">
          <div class="preset-filter-wrap">
            <input type="text" id="popFilter" class="preset-filter" placeholder="Filter populations…">
            <button id="popFilterClear" class="preset-filter-clear" title="Clear filter">✖</button>
          </div>
          <div class="preset-list" id="popList"><div class="presets-empty">Loading populations…</div></div>
        </div>
      </details>
      <details class="section" open data-panel="library">
        <summary>📁 DNA Library</summary>
        <div class="panel-body">
          <div class="library-controls">
            <button id="addCategoryBtn">➕ Add Category</button>
            <button id="saveDnaBtn"><span id="saveBtnText">Save DNA</span></button>
          </div>
          <div class="preset-filter-wrap library-search">
            <input type="text" id="librarySearch" class="preset-filter" placeholder="Search DNA…">
            <button id="librarySearchClear" class="preset-filter-clear" title="Clear search">✖</button>
          </div>
          <ul class="category-list" id="categoryList"></ul>
          <div class="import-export-btns">
            <button id="exportLibBtn">⬇️ Export</button>
            <button id="importLibBtn">⬆️ Import</button>
          </div>
        </div>
      </details>
      <details class="section" data-panel="customdata">
        <summary>⚙️ Custom Data</summary>
        <div class="panel-body">
          <div class="custom-file-row">
            <label for="genesXmlInput">genes.xml</label>
            <input type="file" id="genesXmlInput" accept=".xml">
          </div>
          <div class="custom-file-row">
            <label for="popXmlInput">pop.xml</label>
            <input type="file" id="popXmlInput" accept=".xml">
          </div>
          <div class="custom-status" id="customDataStatus"></div>
          <button id="resetCustomDataBtn" class="ghost">↺ Reset to bundled data</button>
        </div>
      </details>
    </aside>
  </main>
</div>

<div id="toast" class="toast"></div>

<!-- Shared data + codec (tools/js). genes.js / pop.js load their tables asynchronously; the
     editor itself only needs horse-render.js's HorseyData, which is ready immediately. -->
<script src="../js/genes.js"></script>
<script src="../js/pop.js"></script>
<script src="../js/horse-render.js"></script>
<script src="../js/genome-text.js"></script>
<script src="../js/splitter.js"></script>
<script src="../js/custom-data.js"></script>
<script src="../js/dna-library.js"></script>
<script src="../js/pop-presets.js"></script>
<!-- editor-core.js applies a cached custom genes.xml before editor-specs.js sizes the controls -->
<script src="editor-core.js"></script>
<script src="editor-specs.js"></script>
<script src="editor-app.js"></script>
<!-- after the header markup: it fills #dropdownMenu as soon as it runs -->
<script src="../js/headers.js"></script>
<script src='https://storage.ko-fi.com/cdn/scripts/overlay-widget.js'></script>
<script>
  kofiWidgetOverlay.draw('zyonixgaming', {
    'type': 'floating-chat',
    'floating-chat.donateButton.text': 'Support me',
    'floating-chat.donateButton.background-color': '#00b9fe',
    'floating-chat.donateButton.text-color': '#fff'
  });
</script>
</body>
</html>
